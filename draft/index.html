  const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
  if (!isSuccessful) {
    document.getElementById("staticrypt_loading").hidden = true;
    document.getElementById("staticrypt_content").hidden = false;
    document.getElementById("staticrypt-password").focus();
    if (isRememberEnabled) document.getElementById("staticrypt-remember-label").hidden = false;
  }
};
const input = document.getElementById("staticrypt-password"), toggle = document.getElementById("toggle"), msg = document.getElementById("gate-msg");
toggle.addEventListener("click", function () {
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  toggle.textContent = show ? "Hide" : "Show";
  toggle.setAttribute("aria-pressed", String(show));
  toggle.setAttribute("aria-label", show ? templateToggleAltHide : templateToggleAltShow);
});
document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  msg.textContent = "";
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, document.getElementById("staticrypt-remember").checked);
  if (!isSuccessful) { msg.textContent = templateError; input.focus(); }
});
</script>
</body>
</html>
